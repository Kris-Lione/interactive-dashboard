<!DOCTYPE html>
<html lang="en">
<head>
     <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristina's Website</title>
</head>
<body>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/task-manager.js"></script>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Kristina for the WEB-115 course at Wake Tech.</p>
    <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites!!!")</script>
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
    <!--"The <noscript> is for web browsers with JavaScript rendering disabled."-->
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
             <div clas="col" id="metric-converter">
                <script src="js/metric-converter.js" defer></script>
                <form method="get" class="converter">
                    <label for="numeric-value">Enter your value: </label>
                    <input type="text" name="numeric-value" id="numeric-value">
                    <br>

                    <select id="conversion-type" name="conversion-type">
                        <option value="inches-centimeters">Inches to Centimeters</option>
                        <option value="feet-centimeters">Feet to Centimeters</option>
                        <option value="yard-meters">Yards to Meters</option>
                        <option value="miles-kilometers">Miles to Kilometers</option>
                        <option value="centimeter-inch">Centimeters to Inches</option>
                        <option value="centimeter-feet">Centimeters to Feet</option>
                        <option value="meter-yards">Meters to Yards</option>
                        <option value="kilometer-miles">Kilometers to Miles</option>
                    </select>
                    <br>

                    <input type="submit" value="Enter!" id="convertedValue-abc" />
                    <br>

                    <p id="output-value"> </p>
                </form>
             </div>
            <div id="weekly-tasks" class="col">
                <form method="get" class="weekForm">
                    <label for="userName">Enter your first name: </label>
                    <input type="text" name="userName" id="userName">
                    <br>

                    <label for="dailyGoal">Enter your daily task goal: </label>
                    <input type="number" name="dailyGoal" id="dailyGoal">
                    <br>

                    <label for="bonusTasks">Enter your weekly bonus tasks: </label>
                    <input type="number" name="bonusTasks" id="bonusTasks">
                    <br>

                    <input type="submit" value="Enter!" id="goal-btn" />

                    <script src="js/task-manager.js"></script>

                    <p id="goal-message"></p>
                    <script>weeklyGoal(userName, dailyGoal, bonusTasks)</script>
                    <script src="js/task-manager.js">clicking.addEventListener("click", weeklyGoal)</script>
                </form>
            </div>
            
            <div class="col" id="magic-eight-ball">
                <script src="magic-eight-ball.js" defer></script>
                <link rel="stylesheet" href="css/magic-eight-ball.css">
                <h2 class="heading">Magic Eight Ball</h2>
                <form>
                <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                <input id="question" name="question" size="80">
                <div id="magicEightBall">
                    <div id="circle"></div>
                    <img id="ball" src="img/magic-eight-ball.png"/>
                </div>
                <button id="reset" name="reset" type="reset">Ask another question</button>
                </form>
                <br>
            </div>
        </div>
    </div>
</body>
</html>
